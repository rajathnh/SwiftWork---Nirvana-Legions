<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freelancer Dashboard</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="all_gigs.css" />
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body
    class="flex flex-col min-h-screen"
    style="background-image: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%)"
  >
    <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
      <nav
        class="flex items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center"
      >
        <!-- Logo -->
        <div class="md:text-left text-center">
          <h1 class="text-3xl text-blue-500 font-bold">SwiftWork</h1>
        </div>

        <!-- Navigation Links -->
        <div
          class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
        >
          <ul
            class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
          >
            <li>
              <a
                class="hover:text-blue-500 transition-colors"
                href="index.html#home"
                >Home</a
              >
            </li>
            <li>
              <a
                class="hover:text-blue-500 transition-colors"
                href="index.html#about-us"
                >About</a
              >
            </li>
            <li>
              <a
                class="hover:text-blue-500 transition-colors"
                href="index.html#contact-us"
                >Contact us</a
              >
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- Freelancer Dashboard Section -->
    <main class="flex-grow">
      <section class="gig-container mx-auto my-8 px-4">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">
          Available Gigs
        </h2>

        <div
          class="filter-sort-container mb-6 flex flex-wrap items-center justify-between space-x-2 space-y-2"
        >
          <div class="flex-grow min-w-[200px]">
            <label for="budget-filter" class="block text-blue-600 text-lg mb-1"
              >Max Budget</label
            >
            <input
              type="number"
              id="budget-filter"
              placeholder="Budget (₹)"
              class="w-full p-2 rounded-md border border-[#e56f08] bg-white text-black text-sm"
            />
          </div>

          <div class="flex-grow min-w-[200px]">
            <label for="deadline-sort" class="block text-blue-600 text-lg mb-1"
              >Deadline</label
            >
            <select
              id="deadline-sort"
              class="w-full p-2 rounded-md border border-[#e56f08] bg-white text-black text-sm"
            >
              <option value="">All Deadlines</option>
              <option value="nearest">Nearest First</option>
              <option value="farthest">Farthest First</option>
            </select>
          </div>

          <div class="flex-grow min-w-[200px]">
            <label for="budget-sort" class="block text-blue-600 text-lg mb-1"
              >Budget</label
            >
            <select
              id="budget-sort"
              class="w-full p-2 rounded-md border border-[#e56f08] bg-white text-black text-sm"
            >
              <option value="">All Budgets</option>
              <option value="low-to-high">Low to High</option>
              <option value="high-to-low">High to Low</option>
            </select>
          </div>

          <!-- Reset Filters Button -->
          <div class="self-end">
            <button
              id="reset-filters"
              class="bg-[#e56f08] text-white px-4 py-2 rounded-md hover:bg-[#ff8533] transition-colors text-sm"
            >
              Reset
            </button>
          </div>
        </div>

        <div
          id="gig-list"
          class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 p-4"
        ></div>
      </section>
    </main>

    <footer class="mt-4 relative bg-blueGray-200 pt-8 pb-6 bg-blue-950">
      <div class="container mx-auto px-4">
        <hr class="my-6 border-blueGray-300" />
        <div
          class="flex flex-wrap items-center md:justify-between justify-center"
        >
          <div class="w-full md:w-4/12 px-4 mx-auto text-center">
            <div
              class="text-sm text-blueGray-500 font-semibold py-1 text-gray-100"
            >
              © <span id="get-current-year"></span> SwiftWork.
              <a
                href="#home"
                class="text-blueGray-500 hover:text-gray-800"
                target="_blank"
                >All rights reserved.</a
              >
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- Link to external JavaScript file -->
    <script src="all_gigs.js"></script>
    <script>
      document.getElementById("get-current-year").textContent =
        new Date().getFullYear();
    </script>
  </body>
</html>
