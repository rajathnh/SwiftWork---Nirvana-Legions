<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Profile</title>
  <!-- Tailwind CSS for modern styling -->
  <link rel="stylesheet" href="src/output.css">
</head>
<body>
  <!-- Header Section -->
  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
      <!-- Logo -->
      <div class="md:text-left text-center">
        <h1 class="text-3xl text-blue-500 font-bold">SwiftWork</h1>
      </div>

      <!-- Navigation Links -->
      <div class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block">
        <ul class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8">
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>


    <!-- Freelancer Profile Section -->
    <div id="profile" class="profile-header bg-white p-6">
      <p>Loading freelancer profile...</p>
      <button id="editProfileBtn" class="bg-blue-500 text-white py-3 px-8 rounded-full shadow-md hover:bg-blue-600 transition-colors duration-300">
        Edit Profile
      </button>
    </div>

    <!-- Proposals Section -->
    <div id="proposals-section" class="mt-6 p-6 ">
      <h2 class="text-xl font-semibold mb-4">My Proposals</h2>
      <p>Loading proposals...</p>
    </div>

    <!-- Add Buttons to Redirect to Display All Gigs -->
    <div class="view-all-gigs-button flex justify-center mt-6">
      <button id="view-all-gigs-btn" class="btn bg-blue-500 text-white py-3 px-8 rounded-full shadow-md hover:bg-blue-600 transition-colors duration-300">
        View All Projects
      </button>
    </div>

    <!-- Categorized Gigs Section -->
    <div id="gigs-container" class="mt-8">
      <!-- Open Gigs -->
      <div id="open-gigs-section" class="gig-category mb-6">
        <!-- <h3 class="text-xl font-semibold mb-2">Open Gigs</h3>
        <p class="text-gray-500">No open gigs available.</p> -->
      </div>

      <!-- Assigned Gigs -->
      <div id="assigned-gigs-section" class="gig-category mb-6">
        <!-- <h3 class="text-xl font-semibold mb-2">Assigned Gigs</h3>
        <p class="text-gray-500">No assigned gigs available.</p> -->
      </div>

      <!-- Approval Pending Gigs -->
      <div id="approval-pending-gigs-section" class="gig-category mb-6">
        <!-- <h3 class="text-xl font-semibold mb-2">Approval Pending Gigs</h3>
        <p class="text-gray-500">No approval pending gigs available.</p> -->
      </div>

      <!-- Gigs Assigned to Others -->
      <div id="assigned-to-others-gigs-section" class="gig-category">
        <!-- <h3 class="text-xl font-semibold mb-2">Gigs Assigned to Others</h3>
        <p class="text-gray-500">No gigs assigned to others available.</p> -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-8 bg-blue-950 text-gray-100 py-6">
    <div class="container mx-auto px-4 text-center">
      <hr class="my-4 border-blueGray-300">
      <p class="text-sm font-semibold">© 2024 SwiftWork. All rights reserved.</p>
    </div>
  </footer>

  <script src="freelancer-profile.js"></script>
</body>
</html>
