<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Freelancer Profile</title>
  <link rel="stylesheet" href="freelancer-profile.css">
</head>
<body>
  <div class="container">
    <!-- Freelancer Profile Section -->
    <div id="profile" class="profile-header">
      <p>Loading freelancer profile...</p>
    </div>

    <!-- Proposals Section -->
    <div id="proposals-section" class="proposals-section">
      <h2>My Proposals</h2>
      <p>Loading proposals...</p>
    </div>

    <!-- Add Buttons to Redirect to Display All Gigs -->
    <div class="view-all-gigs-button">
      <button id="view-all-gigs-btn" class="btn">View All Gigs</button>
    </div>
  </div>

  <!-- Section for categorized gigs (Open, Assigned, Approval Pending, Assigned to Others) -->
  <div id="open-gigs-section" class="gig-category">
    <h3>Open Gigs</h3>
    <p>No open gigs available.</p> <!-- Placeholder text, will be updated dynamically -->
  </div>

  <div id="assigned-gigs-section" class="gig-category">
    <h3>Assigned Gigs</h3>
    <p>No assigned gigs available.</p> <!-- Placeholder text, will be updated dynamically -->
  </div>

  <div id="approval-pending-gigs-section" class="gig-category">
    <h3>Approval Pending Gigs</h3>
    <p>No approval pending gigs available.</p> <!-- Placeholder text, will be updated dynamically -->
  </div>

  <div id="assigned-to-others-gigs-section" class="gig-category">
    <h3>Assigned to Others Gigs</h3>
    <p>No gigs assigned to others available.</p> <!-- Placeholder text, will be updated dynamically -->
  </div>

  <script src="freelancer-profile.js"></script>

</html>
