<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Sign Up</title>
  <!-- <link rel="stylesheet" href="register-freelancer.css"> -->
  <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-gray-100">

  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex  items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
      <!-- Logo -->
      <div class="md:text-left text-center">
        <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
      </div>
  
      <!-- Navigation Links -->
      <div
        class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
      >
        <ul
          class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
        >
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="mt-4 flex items-center justify-center min-h-screen ">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
      <h2 class="text-3xl font-extrabold text-gray-800 text-center mb-4">Freelancer Sign Up</h2>
      <p class="text-gray-600 text-center mb-6">Join our platform and showcase your skills to the world!</p>

      <!-- Freelancer Sign Up Form -->
      <form id="freelancer-signup-form" action="/signup/freelancer" method="POST" enctype="multipart/form-data">

        <!-- Name -->
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="Enter your full name"
          />
        </div>

        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 "
            placeholder="you@example.com"
          />
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700">Create Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="Create a strong password"
          />
        </div>

        <!-- Skills -->
        <div class="mb-4">
          <label for="skills" class="block text-sm font-medium text-gray-700">Skills</label>
          <input
            type="text"
            id="skills"
            name="skills"
            required
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="e.g., Web Development, Graphic Design"
          />
        </div>

        <!-- Portfolio URL -->
        <div class="mb-4">
          <label for="portfolio" class="block text-sm font-medium text-gray-700">Portfolio URL</label>
          <input
            type="url"
            id="portfolio"
            name="portfolio"
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="e.g., https://yourportfolio.com"
          />
        </div>

        <!-- Bio -->
        <div class="mb-4">
          <label for="bio" class="block text-sm font-medium text-gray-700">Bio</label>
          <textarea
            id="bio"
            name="bio"
            rows="4"
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="Write a brief bio about yourself"
          ></textarea>
        </div>

        <!-- Profile Picture -->
        <div class="mb-6">
          <label for="profilePic" class="block text-gray-700 font-medium mb-2">Profile Picture</label>
          <input
            type="file"
            id="profilePic"
            name="profilePic"
            accept="image/*"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-green-200 focus:outline-none"
          />
        </div>

        <!-- Image 1 upload -->
        <div class="mb-6">
          <label for="image1" class="block text-gray-700 font-medium mb-2">Showcase Image 1</label>
          <input
            type="file"
            id="image1"
            name="image1"
            accept="image/*"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-green-200 focus:outline-none"
          />
        </div>

        <!-- Image 2 upload -->
        <div class="mb-6">
          <label for="image2" class="block text-gray-700 font-medium mb-2">Showcase Image 2</label>
          <input
            type="file"
            id="image2"
            name="image2"
            accept="image/*"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-green-200 focus:outline-none"
          />
        </div>

        <!-- Image 3 upload -->
        <div class="mb-6">
          <label for="image3" class="block text-gray-700 font-medium mb-2">Showcase Image 3</label>
          <input
            type="file"
            id="image3"
            name="image3"
            accept="image/*"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-green-200 focus:outline-none"
          />
        </div>

        <!-- Image 4 upload -->
        <div class="mb-6">
          <label for="image4" class="block text-gray-700 font-medium mb-2">Showcase Image 4</label>
          <input
            type="file"
            id="image4"
            name="image4"
            accept="image/*"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-green-200 focus:outline-none"
          />
        </div>

        <div class="mt-6">
          <button
            type="submit"
            class="w-full px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:ring focus:ring-blue-200 focus:outline-none"
          >
            Sign Up
          </button>
        </div>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-600 text-sm">
          Already have an account?
          <a href="login.html" class="text-blue-500 hover:underline">Sign In</a>
        </p>
      </div>
    </div>
  </div>
  <script src="register-freelancer.js"></script>
</body>


</html>
