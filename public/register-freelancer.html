<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Registration</title>
  <link rel="stylesheet" href="register-freelancer.css"> <!-- Link to your CSS file -->
  <script defer src="register-freelancer.js"></script>
</head>
<body>
  <div class="form-container">
    <h2>Freelancer Registration</h2>
    <form id="freelancer-form">
      <!-- Name -->
      <div>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <!-- Email -->
      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>

      <!-- Password -->
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <!-- Portfolio -->
      <div>
        <label for="portfolio">Portfolio (optional)</label>
        <input type="url" id="portfolio" name="portfolio">
      </div>

      <!-- Bio -->
      <div>
        <label for="bio">Bio (optional)</label>
        <textarea id="bio" name="bio" rows="4"></textarea>
      </div>

      <!-- Skills -->
      <div>
        <label for="skills">Skills</label>
        <input type="text" id="skills" name="skills" required>
        <small>Enter skills separated by commas</small>
      </div>

      <!-- Profile Image -->
      <div>
        <label for="profilePic">Profile Picture</label>
        <input type="file" id="profilePic" name="profilePic">
      </div>

      <!-- Image Uploads (Image 1 to Image 4) -->
      <div>
        <label for="image1">Image 1</label>
        <input type="file" id="image1" name="image1">
      </div>

      <div>
        <label for="image2">Image 2</label>
        <input type="file" id="image2" name="image2">
      </div>

      <div>
        <label for="image3">Image 3</label>
        <input type="file" id="image3" name="image3">
      </div>

      <div>
        <label for="image4">Image 4</label>
        <input type="file" id="image4" name="image4">
      </div>

      <!-- Submit Button -->
      <button type="submit">Register</button>
    </form>

    <div id="error-message"></div>
  </div>
</body>
</html>
