<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Sign Up</title>
  <!-- <link rel="stylesheet" href="register-freelancer.css"> -->
  <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-[#2B2A4C] text-[#EEE2DE]">

  <header class="bg-[#EEE2DE] placeholder: shadow-md">
    <nav class="flex items-center justify-between w-[92%] mx-auto py-4">
      <!-- Logo -->
      <div class="text-center">
        <h1 class="text-3xl font-bold text-[#e56f08]">SwiftWork</h1>
      </div>

      <!-- Navigation Links -->
      <ul class="hidden md:flex space-x-8 text-lg">
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#home">Home</a></li>
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#about-us">About</a></li>
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#contact-us">Contact us</a></li>
      </ul>

      <!-- Mobile Menu Toggle -->
      <button id="menu-toggle" class="block md:hidden text-[#e56f08] focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
    </nav>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-[#EEE2DE] text-center text-lg py-4">
      <a href="index.html#home" class="block py-2 text-[#e56f08] hover:text-[#000000]">Home</a>
      <a href="index.html#about-us" class="block py-2 text-[#e56f08] hover:text-[#000000]">About</a>
      <a href="index.html#contact-us" class="block py-2 text-[#e56f08] hover:text-[#000000]">Contact us</a>
    </div>
  </header>

  <main class="flex flex-wrap md:flex-nowrap items-center justify-center py-12 px-4">
    <!-- Freelancer Sign Up Form Container -->
    <div class="w-full max-w-md bg-[#EEE2DE] text-[#2B2A4C] rounded-lg shadow-lg p-8">
      <h2 class="text-3xl font-extrabold text-center mb-4">Freelancer Sign Up</h2>
      <p class="text-center mb-6 text-[#EA906C]">Join our platform and showcase your skills to the world!</p>

      <!-- Freelancer Sign Up Form -->
      <form id="freelancer-signup-form" action="/signup/freelancer" method="POST" enctype="multipart/form-data">

        <!-- Name -->
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm focus:ring-[#EA906C] focus:border-[#EA906C] text-[#2B2A4C]"
            placeholder="Enter your full name"
          />
        </div>

        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm focus:ring-[#EA906C] focus:border-[#EA906C] text-[#2B2A4C]"
            placeholder="you@example.com"
          />
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium">Create Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm focus:ring-[#EA906C] focus:border-[#EA906C] text-[#2B2A4C]"
            placeholder="Create a strong password"
          />
        </div>

        <!-- Skills -->
        <div class="mb-4">
          <label for="skills" class="block text-sm font-medium">Skills</label>
          <input
            type="text"
            id="skills"
            name="skills"
            required
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm focus:ring-[#EA906C] focus:border-[#EA906C] text-[#2B2A4C]"
            placeholder="e.g., Web Development, Graphic Design"
          />
        </div>

        <!-- Portfolio URL -->
        <div class="mb-4">
          <label for="portfolio" class="block text-sm font-medium">Portfolio URL</label>
          <input
            type="url"
            id="portfolio"
            name="portfolio"
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm focus:ring-[#EA906C] focus:border-[#EA906C] text-[#2B2A4C]"
            placeholder="e.g., https://yourportfolio.com"
          />
        </div>

        <!-- Bio -->
        <div class="mb-4">
          <label for="bio" class="block text-sm font-medium">Bio</label>
          <textarea
            id="bio"
            name="bio"
            rows="4"
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm focus:ring-[#EA906C] focus:border-[#EA906C] text-[#2B2A4C]"
            placeholder="Write a brief bio about yourself"
          ></textarea>
        </div>

        <!-- Profile Picture -->
        <div class="mb-6">
          <label for="profilePic" class="block font-medium mb-2">Profile Picture</label>
          <input
            type="file"
            id="profilePic"
            name="profilePic"
            accept="image/*"
            class="w-full px-4 py-2 border border-[#EA906C] rounded-lg focus:ring-[#EA906C] focus:outline-none text-[#2B2A4C]"
          />
        </div>

        <!-- Image 1 upload -->
        <div class="mb-6">
          <label for="image1" class="block font-medium mb-2">Showcase Image 1</label>
          <input
            type="file"
            id="image1"
            name="image1"
            accept="image/*"
            required
            class="w-full px-4 py-2 border border-[#EA906C] rounded-lg focus:ring-[#EA906C] focus:outline-none text-[#2B2A4C]"
          />
        </div>

        <!-- Image 2 upload -->
        <div class="mb-6">
          <label for="image2" class="block font-medium mb-2">Showcase Image 2</label>
          <input
            type="file"
            id="image2"
            name="image2"
            accept="image/*"
            class="w-full px-4 py-2 border border-[#EA906C] rounded-lg focus:ring-[#EA906C] focus:outline-none text-[#2B2A4C]"
          />
        </div>

        <!-- Image 3 upload -->
        <div class="mb-6">
          <label for="image3" class="block font-medium mb-2">Showcase Image 3</label>
          <input
            type="file"
            id="image3"
            name="image3"
            accept="image/*"
            class="w-full px-4 py-2 border border-[#EA906C] rounded-lg focus:ring-[#EA906C] focus:outline-none text-[#2B2A4C]"
          />
        </div>

        <!-- Image 4 upload -->
        <div class="mb-6">
          <label for="image4" class="block font-medium mb-2">Showcase Image 4</label>
          <input
            type="file"
            id="image4"
            name="image4"
            accept="image/*"
            class="w-full px-4 py-2 border border-[#EA906C] rounded-lg focus:ring-[#EA906C] focus:outline-none text-[#2B2A4C]"
          />
        </div>

        <div class="mt-6">
          <button
            type="submit"
            class="w-full px-6 py-2 text-white bg-[#B31312] rounded-lg hover:bg-[#EA906C] focus:ring focus:ring-[#EA906C] focus:outline-none"
          >
            Sign Up
          </button>
        </div>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-[#2B2A4C]">
          Already have an account?
          <a href="login.html" class="text-[#B31312] hover:text-[#EA906C]">Sign In</a>
        </p>
      </div>
    </div>

    <!-- Adjacent Image Box -->
  
  </main>


  <footer class="bg-[#2B2A4C] py-6">
    <div class="container mx-auto px-4 text-center">
      <hr class="my-4 border-[#EEE2DE]">
      <p class="text-sm">
        © 2024 SwiftWork. <a href="#home" class="text-[#EA906C] hover:underline">All rights reserved.</a>
      </p>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    const menuToggle = document.getElementById("menu-toggle");
    const mobileMenu = document.getElementById("mobile-menu");

    menuToggle.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
  </script>
  <script src="register-freelancer.js"></script>
</body>

</html>
