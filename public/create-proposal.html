<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Proposal</title>
    <!-- <link rel="stylesheet" href="create-proposal.css"> -->
    <link rel="stylesheet" href="src/output.css">
</head>
<body style="background-image: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);">
    <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
        <nav class="flex  items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
          <!-- Logo -->
          <div class="md:text-left text-center">
            <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
          </div>
      
          <!-- Navigation Links -->
          <div
            class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
          >
            <ul
              class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
            >
              <li>
                <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
              </li>
              <li>
                <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
              </li>
              <li>
                <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
              </li>
            </ul>
          </div>
        </nav>
      </header>
    <div class="container mx-auto px-4 py-8 flex flex-col items-center justify-center min-h-screen">
        <!-- Header Section -->
        
    
        <!-- Gig Details Section -->
        <div class="Project-details bg-white p-6 rounded-lg shadow-lg mb-5 max-w-5xl w-full">
            <h1 class="text-3xl text-center font-bold text-black mb-5 ">Create Proposal</h1>
            <h2 id="Project-title" class="text-xl font-semibold text-red-700 mb-2">Title:</h2>
            <p id="Project-description" class="text-gray-700 mb-2">Description:</p>
            <p id="Project-budget" class="text-gray-700 mb-2">Budget:</p>
            <p id="Project-deadline" class="text-gray-700 mb-4">Deadline:</p>
        </div>
    
        <!-- Proposal Form Section -->
        <div class="proposal-form bg-white p-6 rounded-lg shadow-lg max-w-5xl w-full">
            <textarea id="proposalMessage" placeholder="Write your proposal message here..." maxlength="1000" class="w-full p-4 rounded-lg border border-gray-300 shadow-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            
            <input type="number" id="bidAmount" placeholder="Enter your bid amount" min="1" class="w-full p-4 rounded-lg border border-gray-300 shadow-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    
            <div class="flex justify-center">
                <button id="submit-proposal-button" 
                        class="bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:from-blue-600 hover:to-indigo-600 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition-transform duration-300 ">
                    Submit Proposal
                </button>
            </div>
            
        </div>
    </div>
    
    <footer class=" mt-4 relative bg-blueGray-200 pt-8 pb-6 bg-blue-950">
        <div class="container mx-auto px-4">
          <hr class="my-6 border-blueGray-300">
                <div class="flex flex-wrap items-center md:justify-between justify-center">
                  <div class="w-full md:w-4/12 px-4 mx-auto text-center">
                    <div class="text-sm text-blueGray-500 font-semibold py-1 text-gray-100">
                      © 2024 <span id="get-current-year">SwiftWork.</span><a href="#home" class="text-blueGray-500 hover:text-gray-800" target="_blank"> All rights reserved.
                      
                    </div>
                  </div>
                </div>
              </div>
      </footer>
    <script src="create-proposal.js"></script>
</body>
</html>
