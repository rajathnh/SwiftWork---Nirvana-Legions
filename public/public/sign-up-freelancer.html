<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Sign-Up</title>
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-50">

  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex justify-between items-center w-[92%] text-xl mx-auto py-4">
      <!-- Logo -->
      <div>
        <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
      </div>
  
      <!-- Navigation Links -->
      <div
        class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0  top-[-100%] w-auto items-center px-5"
      >
        <ul
          class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
        >
          <li>
            <a class="hover:text-blue-500 transition-colors" href="#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
      </nav>
  </header>

  <section class="min-h-screen flex items-center justify-center px-6">
    <div class="max-w-2xl w-full bg-white shadow-lg rounded-lg p-8">
      <!-- Header -->
      <h2 class="text-3xl font-extrabold text-gray-800 text-center mb-4">Sign Up as a Freelancer</h2>
      <p class="text-gray-600 text-center mb-6">Join our platform and showcase your skills to the world!</p>

      <!-- Sign-Up Form -->
      <form action="#" method="POST" enctype="multipart/form-data" class="space-y-6">
        <!-- Name Field -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" id="name" name="name" required 
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800">
        </div>

        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="email" name="email" required 
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800">
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Create Password</label>
          <input type="password" id="password" name="password" required 
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800">
        </div>

        <!-- Bio Field -->
        <div>
          <label for="bio" class="block text-sm font-medium text-gray-700">Bio</label>
          <textarea id="bio" name="bio" rows="4" required 
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"></textarea>
        </div>

        <!-- Skills Section -->
  <!-- Skills Section -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-2">Skills</label>

  <!-- Skills Table -->
  <div class="overflow-x-auto">
    <table id="skillsTable" class="w-full border-collapse border border-gray-300">
      <thead>
        <tr class="bg-blue-500 text-white text-left">
          <th class="p-3 border border-gray-300">Skill</th>
        </tr>
      </thead>
      <tbody>
        <tr class="bg-gray-50">
          <td class="p-3 border border-gray-300">
            <input 
              type="text" 
              class="w-full px-2 py-1 border-none outline-none bg-transparent"
              placeholder="Enter a skill and press Enter"
              onkeydown="addSkillRow(event)"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Function to dynamically add rows to the table
  function addSkillRow(event) {
    if (event.key === "Enter") {
      event.preventDefault(); // Prevent form submission
      
      const input = event.target;
      const tableBody = document.querySelector("#skillsTable tbody");

      // Check if the input has a value
      if (input.value.trim() !== "") {
        // Create a new table row
        const newRow = document.createElement("tr");
        newRow.className = tableBody.childElementCount % 2 === 0 ? "bg-gray-50" : "bg-white"; // Alternating colors

        // Add a single cell with input
        newRow.innerHTML = `
          <td class="p-3 border border-gray-300">
            <input 
              type="text" 
              class="w-full px-2 py-1 border-none outline-none bg-transparent"
              placeholder="Enter a skill and press Enter"
              onkeydown="addSkillRow(event)"
            />
          </td>
        `;

        // Append the new row to the table
        tableBody.appendChild(newRow);

        // Focus the new input field
        newRow.querySelector("input").focus();
      }
    }
  }
</script>

  
  
  
  

      <!-- Image Upload Section -->
<div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Portfolio Images</label>
    
    <!-- Drop Zone -->
    <div 
      id="dropZone" 
      class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center relative cursor-pointer hover:bg-gray-50"
      ondragover="handleDragOver(event)" 
      ondrop="handleDrop(event)" 
      onclick="document.getElementById('imageInput').click()"
    >
      <p id="dropZoneText" class="text-sm text-gray-600">
        Drag and drop your images here, or <span class="text-blue-500 cursor-pointer hover:underline">browse</span>
      </p>
      <input 
        type="file" 
        id="imageInput" 
        name="images[]" 
        accept="image/*" 
        multiple 
        required 
        class="absolute inset-0 opacity-0 cursor-pointer" 
        onchange="handleFileSelect(event)"
      />
    </div>
  
    <!-- Preview Section -->
    <div id="previewContainer" class="flex flex-wrap gap-4 mt-4">
      <!-- Image previews will be appended here -->
    </div>
    
    <p class="text-sm text-gray-500 mt-2">You must upload at least 1 image and up to 4 images.</p>
  </div>
  

        <!-- Submit Button -->
        <button type="submit" 
          class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-300">
          Sign Up
        </button>
      </form>
    </div>
  </section>
  <script>
    {
        const MAX_IMAGES = 4; // Limit to 4 images

// Handle file selection
function handleFileSelect(event) {
  const files = event.target.files;
  handleFiles(files);
  event.target.value = ""; // Clear the file input to allow re-selection of the same file
}

// Handle drag-and-drop
function handleDrop(event) {
  event.preventDefault();
  const files = event.dataTransfer.files;
  handleFiles(files);
}

// Prevent default drag-over behavior
function handleDragOver(event) {
  event.preventDefault();
}

// Process uploaded files
function handleFiles(files) {
  const previewContainer = document.getElementById("previewContainer");
  const dropZoneText = document.getElementById("dropZoneText");
  const existingImages = previewContainer.children.length;

  if (existingImages + files.length > MAX_IMAGES) {
    alert(`You can only upload up to ${MAX_IMAGES} images.`);
    return;
  }

  Array.from(files).forEach((file, index) => {
    if (existingImages + index >= MAX_IMAGES) return;

    if (file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const imgElement = document.createElement("div");
        imgElement.className = "relative w-24 h-24 rounded-lg overflow-hidden border border-gray-300";
        imgElement.innerHTML = `
          <img src="${e.target.result}" alt="Uploaded Image" class="w-full h-full object-cover" />
          <button 
            class="absolute top-0 right-0 bg-red-500 text-white text-xs px-1 rounded-bl"
            onclick="removeImage(this)"
          >
            &times;
          </button>
        `;
        previewContainer.appendChild(imgElement);
      };
      reader.readAsDataURL(file);
    } else {
      alert("Only image files are allowed.");
    }
  });

  // Update drop zone text
  if (previewContainer.children.length > 0) {
    dropZoneText.textContent = "Drag and drop more images, or browse to upload.";
  }
}

// Remove an image
function removeImage(button) {
  const imageDiv = button.parentElement;
  imageDiv.remove();

  const dropZoneText = document.getElementById("dropZoneText");
  const previewContainer = document.getElementById("previewContainer");

  // Reset drop zone text if no images remain
  if (previewContainer.children.length === 0) {
    dropZoneText.textContent = "Drag and drop your images here, or browse.";
  }
}


    }
  </script>
</body>
</html>
