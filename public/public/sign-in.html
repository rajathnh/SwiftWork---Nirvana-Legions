<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-blue-500">

  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex justify-between items-center w-[92%] text-xl mx-auto py-4">
      <!-- Logo -->
      <div>
        <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
      </div>
  
      <!-- Navigation Links -->
      <div
        class="nav-links md:static absolute bg-red-800 md:min-h-fit min-h-[60vh] left-0  top-[-100%] w-auto items-center px-5"
      >
        <ul
          class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
        >
          <li>
            <a class="hover:text-blue-500 transition-colors" href="#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
      </nav>
  </header>

  <section class="min-h-screen mx-auto flex items-center justify-center px-6">
    <div class="max-w-md w-full bg-white shadow-lg rounded-lg p-8">
      <!-- Header -->
      <h2 class="text-3xl font-extrabold text-gray-800 text-center mb-4">Welcome Back</h2>
      <p class="text-gray-600 text-center mb-6">Sign in to your account</p>

      <!-- Sign-In Form -->
      <form action="#" method="POST" class="space-y-6">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="email" name="email" required 
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800">
        </div>
        
        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password" required 
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800">
        </div>
        
        <!-- Forgot Password -->
        <div class="flex items-center justify-between">
          <a href="#" class="text-sm text-blue-500 hover:underline">Forgot your password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
          class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-300">
          Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="px-3 text-gray-500 text-sm">OR</span>
        <div class="flex-grow border-t border-gray-300"></div>
      </div>

      <!-- Social Login -->
      <div class="flex flex-col gap-4">
        <button class="w-full flex items-center justify-center bg-gray-100 text-gray-700 font-medium py-2 px-4 rounded-lg hover:bg-gray-200 transition duration-300">
          <img src="https://img.icons8.com/color/24/google-logo.png" alt="Google" class="mr-2"> Sign in with Google
        </button>
        <button class="w-full flex items-center justify-center bg-gray-100 text-gray-700 font-medium py-2 px-4 rounded-lg hover:bg-gray-200 transition duration-300">
          <img src="https://img.icons8.com/color/24/facebook-new.png" alt="Facebook" class="mr-2"> Sign in with Facebook
        </button>
      </div>

      <!-- Footer -->
      <p class="text-center text-sm text-gray-600 mt-6">
        Don’t have an account? 
        <a href="#" class="text-blue-500 font-medium hover:underline">Sign up</a>
      </p>
    </div>
  </section>
</body>
</html>
