<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=notifications" />
    <script src="script.js"></script>
</head>
<body>
    <header class="shadow-md">
        <div class="container mx-auto flex justify-between items-center px-4 py-3">
          <!-- Logo -->
          <a href="#" class="text-xl font-bold md:text-2xl text-blue-600">Swiftwork</a>
      
          <!-- Right Section -->
          <div class="flex items-center space-x-4">
            <!-- Notification Icon -->
            <button class="relative">
              <span class="material-symbols-outlined">
                notifications
                </span>
            </button>
      
            <!-- Profile Section -->
            <div class="relative flex items-center space-x-2">
              <!-- Status Indicator -->
              <span
                class="w-3 h-3 rounded-full"
                id="statusIndicator"
                title="Available"
              ></span>
              <!-- Profile Picture -->
              <a href="/profile" class="block w-8 h-8 rounded-full overflow-hidden border-2 border-blue-600">
                <img
                  src="https://via.placeholder.com/150"
                  alt="Profile Picture"
                  class="w-full h-full object-cover"
                />
              </a>
            </div>
          </div>
        </div>
      </header>
      
</body>
</html>
