<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Sign Up</title>
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
    <h2 class="text-3xl font-bold text-blue-500 text-center mb-6">Client Sign Up</h2>

    <form action="/signup" method="POST">

      <div class="mb-4">
        <label for="name" class="block text-gray-700 font-medium mb-2">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-200 focus:outline-none"
          placeholder="Enter your full name"
        />
      </div>

      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-200 focus:outline-none"
          placeholder="you@example.com"
        />
      </div>

      <div class="mb-6">
        <label for="password" class="block text-gray-700 font-medium mb-2">Create Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-200 focus:outline-none"
          placeholder="Create a strong password"
        />
      </div>

      <div class="mt-6">
        <button
          type="submit"
          class="w-full px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:ring focus:ring-blue-200 focus:outline-none"
        >
          Sign Up
        </button>
      </div>
    </form>

    <div class="mt-6 text-center">
      <p class="text-gray-600 text-sm">
        Already have an account? 
        <a href="sign-in.html" class="text-blue-500 hover:underline">Sign In</a>
      </p>
    </div>
  </div>

  <!-- you have to have a js file to send data and render different pages on different action -->
  <script src="sign-up-client.js"></script>

</body>
</html>
