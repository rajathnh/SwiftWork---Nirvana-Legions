<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gig Details</title>
  <link rel="stylesheet" href="src/output.css">
  <!-- <link rel="stylesheet" href="gig-details.css"> -->
</head>

<body class="gig-details-body flex flex-col min-h-screen">
  
  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex  items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
      <!-- Logo -->
      <div class="md:text-left text-center">
        <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
      </div>
  
      <!-- Navigation Links -->
      <div
        class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
      >
        <ul
          class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
        >
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="gig-details-container-wrapper flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 p-8 max-w-6xl mx-auto">
      <!-- First Container (Gig Details) -->
      <div class="gig-details-container bg-white p-8 rounded-lg shadow-lg text-center">
        <h1 id="gig-title" class="text-3xl font-semibold text-red-700 mb-4">Loading Gig Details...</h1>
        <p id="gig-description" class="text-gray-700 mb-4">Loading description...</p>
        <p id="gig-budget" class="text-lg font-medium text-gray-800 mb-4">Budget: Loading...</p>
        <p id="gig-deadline" class="text-lg font-medium text-gray-800 mb-4">Deadline: Loading...</p>
        <p id="client-name" class="text-lg font-medium text-gray-800 mb-6">Loading client information...</p>
        <p id="gig-skills" class="text-lg font-medium text-gray-800 mb-6">Loadin skills Required</p>
        <button id="view-client-btn" class="bg-blue-500 text-white py-2 px-6 rounded-full shadow-md hover:bg-blue-600 transition duration-300 mb-6">
          View Client Portfolio
        </button>
      </div>
  
      <!-- Second Container (Proposals Section) -->
      <div class="gig-details-container bg-white p-8 rounded-lg shadow-lg text-center">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Proposals</h2>
        <ul id="proposals-list" class="list-none pl-5 text-gray-700 mb-6">
          <li>Loading proposals...</li>
        </ul>
  
        <!-- Make Proposal Button -->
        <button id="make-proposal-btn" class="bg-green-500 text-white py-2 px-6 rounded-full shadow-md hover:bg-green-600 transition duration-300" style="display: none;">
          Make Proposal
        </button>
  
        <!-- Message Display -->
        <p id="proposal-message" class="text-gray-600 mt-4"></p>
      </div>
    </div>
  </div>

  <footer class=" mt-4 relative bg-blueGray-200 pt-8 pb-6 bg-blue-950">
    <div class="container mx-auto px-4">
      <hr class="my-6 border-blueGray-300">
            <div class="flex flex-wrap items-center md:justify-between justify-center">
              <div class="w-full md:w-4/12 px-4 mx-auto text-center">
                <div class="text-sm text-blueGray-500 font-semibold py-1 text-gray-100">
                  © 2024 <span id="get-current-year">SwiftWork.</span><a href="#home" class="text-blueGray-500 hover:text-gray-800" target="_blank"> All rights reserved.
                  
                </div>
              </div>
            </div>
          </div>
  </footer>

  <script src="gig-details.js"></script>
</body>

</html>
