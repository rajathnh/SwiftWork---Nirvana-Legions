<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details</title>
  <link rel="stylesheet" href="src/output.css">
  <!-- <link rel="stylesheet" href="gig-details.css"> -->
</head>

<body class="gig-details-body flex flex-col min-h-screen bg-[#2B2A4C] text-[#EEE2DE]">
  
  <header class="bg-[#EEE2DE] placeholder: shadow-md">
    <nav class="flex items-center justify-between w-[92%] mx-auto py-4">
      <!-- Logo -->
      <div class="text-center">
        <h1 class="text-3xl font-bold text-[#e56f08]">SwiftWork</h1>
      </div>

      <!-- Navigation Links -->
      <ul class="hidden md:flex space-x-8 text-lg">
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#home">Home</a></li>
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#about-us">About</a></li>
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#contact-us">Contact us</a></li>
      </ul>

      <!-- Mobile Menu Toggle -->
      <button id="menu-toggle" class="block md:hidden text-[#e56f08] focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
    </nav>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-[#EEE2DE] text-center text-lg py-4">
      <a href="index.html#home" class="block py-2 text-[#e56f08] hover:text-[#000000]">Home</a>
      <a href="index.html#about-us" class="block py-2 text-[#e56f08] hover:text-[#000000]">About</a>
      <a href="index.html#contact-us" class="block py-2 text-[#e56f08] hover:text-[#000000]">Contact us</a>
    </div>
  </header>

  <div class="gig-details-container-wrapper flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 p-8 max-w-6xl mx-auto">
      <!-- First Container (Gig Details) -->
      <div class="gig-details-container bg-[#EEE2DE] p-8 rounded-lg shadow-lg text-center">
        <h1 id="gig-title" class="text-3xl font-semibold text-red-800 mb-4">Loading Gig Details...</h1>
        <p id="gig-description" class="text-[#e56f08] mb-4">Loading description...</p>
        <p id="gig-budget" class="text-lg font-medium text-gray-800 mb-4">Budget: Loading...</p>
        <p id="gig-deadline" class="text-lg font-medium text-gray-800 mb-4">Deadline: Loading...</p>
        <p id="client-name" class="text-lg font-medium text-gray-800 mb-6">Loading client information...</p>
        <p id="gig-skills" class="text-lg font-medium text-gray-800 mb-6">Loadin skills Required</p>
        <button id="view-client-btn" class="bg-[#B31312] text-white py-2 px-6 rounded-full shadow-md hover:bg-blue-600 transition duration-300 mb-6">
          View Client Portfolio
        </button>
      </div>
  
      <!-- Second Container (Proposals Section) -->
      <div class="gig-details-container bg-[#EEE2DE] p-8 rounded-lg shadow-lg text-center">
        <h2 class="text-2xl font-semibold text-[#e56f08] mb-4">Proposals</h2>
        <ul id="proposals-list" class="list-none pl-5 text-gray-700 mb-6">
          <li>Loading proposals...</li>
        </ul>
  
        <!-- Make Proposal Button -->
        <button id="make-proposal-btn" class="bg-green-500 text-white py-2 px-6 rounded-full shadow-md hover:bg-green-600 transition duration-300" style="display: none;">
          Make Proposal
        </button>
  
        <!-- Message Display -->
        <p id="proposal-message" class="text-gray-600 mt-4"></p>
      </div>
    </div>
  </div>

  <footer class="bg-[#2B2A4C] py-6">
    <div class="container mx-auto px-4 text-center">
      <hr class="my-4 border-[#EEE2DE]">
      <p class="text-sm">
        © 2024 SwiftWork. <a href="#home" class="text-[#EA906C] hover:underline">All rights reserved.</a>
      </p>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    const menuToggle = document.getElementById("menu-toggle");
    const mobileMenu = document.getElementById("mobile-menu");

    menuToggle.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
  </script>

  <script src="gig-details.js"></script>
</body>

</html>
