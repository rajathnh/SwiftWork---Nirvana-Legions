<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- <link rel="stylesheet" href="login.css"> -->
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="h-full bg-gray-100">

  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex  items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
      <!-- Logo -->
      <div class="md:text-left text-center">
        <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
      </div>
  
      <!-- Navigation Links -->
      <div
        class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
      >
        <ul
          class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
        >
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="min-h-screen flex flex-col justify-between">
  <div class="login-container max-w-md w-full bg-white rounded-lg shadow-lg p-8 mx-auto mt-12 flex-grow">
    <h1 class="text-3xl font-extrabold text-gray-800 text-center mb-4">Login</h1>
    <form id="login-form">
      <!-- Email -->
      <div class="form-group mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-2">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
          class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
        />
      </div>
  
      <!-- Password -->
      <div class="form-group mb-4">
        <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
          class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
        />
      </div>
  
      <!-- Login Button -->
      <button
        type="submit"
        class="login-btn w-full px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:ring focus:ring-blue-200 focus:outline-none"
      >
        Login
      </button>
    </form>
  
    <!-- Register Link -->
    <p class="register-link mt-4 text-center text-gray-600">
      Don't have an account? 
      <a href="index.html" class="text-blue-500 hover:underline">Register</a>
    </p>
  </div>
 
  

  <footer class="mt-3 relative bg-blueGray-200 pt-8 pb-6 bg-blue-950">
    <div class="container mx-auto px-4">
      <hr class="my-6 border-blueGray-300">
            <div class="flex flex-wrap items-center md:justify-between justify-center">
              <div class="w-full md:w-4/12 px-4 mx-auto text-center">
                <div class="text-sm text-blueGray-500 font-semibold py-1 text-gray-100">
                  © 2024 <span id="get-current-year">SwiftWork.</span><a href="#home" class="text-blueGray-500 hover:text-gray-800" target="_blank"> All rights reserved.
                  
                </div>
              </div>
            </div>
          </div>
  </footer>
</div>
  <script src="login.js"></script>
</body>
</html>
