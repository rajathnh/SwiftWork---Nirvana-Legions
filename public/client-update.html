<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Client Profile</title>
    <link href="src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="client-update.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold text-center mb-6">Update Client Profile</h2>
            <form id="updateClientForm" enctype="multipart/form-data">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700">Name</label>
                    <input type="text" id="name" name="name" class="w-full p-3 border border-gray-300 rounded" placeholder="Enter your name">
                </div>

                <div class="mb-4">
                    <label for="email" class="block text-gray-700">Email</label>
                    <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded" placeholder="Enter your email">
                </div>

               <!-- <div class="mb-4">
                    <label for="password" class="block text-gray-700">Password</label>
                    <input type="password" id="password" name="password" class="w-full p-3 border border-gray-300 rounded" placeholder="Enter new password (optional)">
                </div> -->

                <div class="mb-4">
                    <label for="profilePic" class="block text-gray-700">Profile Picture</label>
                    <input type="file" id="profilePic" name="profilePic" class="w-full p-3 border border-gray-300 rounded">
                </div>

                <div class="mb-4">
                    <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded">Update Profile</button>
                </div>

                <div id="errorMessage" class="text-red-500 hidden">Something went wrong, please try again!</div>
                <div id="successMessage" class="text-green-500 hidden">Profile updated successfully!</div>
            </form>
        </div>
    </div>

    <script src="client-update.js"></script>
</body>
</html>
