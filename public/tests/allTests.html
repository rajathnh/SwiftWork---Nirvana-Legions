<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Skills Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .test-container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .test-button {
            display: block;
            width: 250px;
            margin: 20px auto;
            padding: 15px;
            font-size: 18px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        #html-test {
            background-color: #E34F26;
        }
        #css-test {
            background-color: #1572B6;
        }
        #js-test {
            background-color: #F7DF1E;
            color: black;
        }
        .test-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Web Development Skills Tests</h1>
        <a href="htmlExpert.html" class="test-button" id="html-test">HTML Test</a>
        <a href="cssExpert.html" class="test-button" id="css-test">CSS Test</a>
        <a href="jsExpert.html" class="test-button" id="js-test">JavaScript Test</a>
    </div>
</body>
</html>
