<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <title>Payment Options - SwiftWork</title>
  </head>
  <body class="bg-gradient-to-br from-purple-50 to-purple-100 min-h-screen">
    <main class="flex items-center justify-center py-12">
      <div
        class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md text-center"
      >
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
          Choose a Payment Method
        </h1>
        <div class="space-y-4">
          <button
            class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700"
          >
            Pay with UPI
          </button>
          <button
            class="w-full bg-gray-800 text-white py-3 rounded-lg hover:bg-gray-900"
          >
            Pay with Stripe
          </button>
          <button
            class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700"
          >
            Pay with PayPal
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
