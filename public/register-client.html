<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Sign Up</title>
  <!-- <link rel="stylesheet" href="register-client.css"> -->
  <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-gray-100">

  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex  items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
      <!-- Logo -->
      <div class="md:text-left text-center">
        <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
      </div>
  
      <!-- Navigation Links -->
      <div
        class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
      >
        <ul
          class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
        >
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  
    <div class="flex items-center justify-center min-h-screen">
      <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-extrabold text-gray-800 text-center mb-4">Client Sign Up</h2>
        <p class="text-gray-600 text-center mb-6">Join our platform to hire the best talents!</p>
  
        <!-- Client Sign Up Form -->
        <form id="client-signup-form" action="/signup" method="POST" enctype="multipart/form-data">
  
          <!-- Full Name -->
          <div class="mb-4">
            <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              required
              class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
              placeholder="Enter your full name"
            />
          </div>
  
          <!-- Email Address -->
          <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
              placeholder="you@example.com"
            />
          </div>
  
          <!-- Password -->
          <div class="mb-4">
            <label for="password" class="block text-sm font-medium text-gray-700">Create Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
              placeholder="Create a strong password"
            />
          </div>
  
          <!-- Profile Picture -->
          <div class="mb-4">
            <label for="profilePic" class="block text-sm font-medium text-gray-700">Profile Picture</label>
            <input
              type="file"
              id="profilePic"
              name="profilePic"
              accept="image/*"
              class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
  
          <!-- Submit Button -->
          <div class="mt-6">
            <button
              type="submit"
              class="w-full px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:ring focus:ring-blue-200 focus:outline-none"
            >
              Sign Up
            </button>
          </div>
        </form>
  
        <div class="mt-6 text-center">
          <p class="text-gray-600 text-sm">
            Already have an account? 
            <a href="login.html" class="text-blue-500 hover:underline">Sign In</a>
          </p>
        </div>
      </div>
      

    </div>
  
    <footer class="relative bg-blueGray-200 pt-8 pb-6 bg-blue-950">
      <div class="container mx-auto px-4">
        <hr class="my-6 border-blueGray-300">
              <div class="flex flex-wrap items-center md:justify-between justify-center">
                <div class="w-full md:w-4/12 px-4 mx-auto text-center">
                  <div class="text-sm text-blueGray-500 font-semibold py-1 text-gray-100">
                    © 2024 <span id="get-current-year">SwiftWork.</span><a href="#home" class="text-blueGray-500 hover:text-gray-800" target="_blank"> All rights reserved.
                    
                  </div>
                </div>
              </div>
            </div>
    </footer>
  

  <script src="register-client.js"></script>

</body>

</html>
