<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Freelancer Profile</title>
  <link href="src/output.css" rel="stylesheet">
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-100">

  <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
    <nav class="flex items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
      <!-- Logo -->
      <div class="md:text-left text-center">
        <h1 class="text-3xl text-blue-500 font-bold">SwiftWork</h1>
      </div>

      <!-- Navigation Links -->
      <div class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block">
        <ul class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8">
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
          </li>
          <li>
            <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  <div class="mt-4 flex items-center justify-center min-h-screen">
    <div class="max-w-3xl w-full bg-white rounded-lg shadow-lg p-8">
      <h2 class="text-3xl font-extrabold text-gray-800 text-center mb-6">Update Freelancer Profile</h2>
  
      <form id="updateFreelancerForm" enctype="multipart/form-data">
        <!-- Name -->
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="Enter your name"
          />
        </div>
  
        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="Enter your email"
          />
        </div>
  
        <!-- Skills -->
        <div class="mb-4">
          <label for="skills" class="block text-sm font-medium text-gray-700">Skills</label>
          <input
            type="text"
            id="skills"
            name="skills"
            required
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="Enter your skills"
          />
        </div>
  
        <!-- Bio -->
        <div class="mb-4">
          <label for="bio" class="block text-sm font-medium text-gray-700">Bio</label>
          <textarea
            id="bio"
            name="bio"
            rows="4"
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="Write a brief bio about yourself"
          ></textarea>
        </div>
  
        <!-- Portfolio URL -->
        <div class="mb-4">
          <label for="portfolio" class="block text-sm font-medium text-gray-700">Portfolio URL</label>
          <input
            type="url"
            id="portfolio"
            name="portfolio"
            class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-gray-800"
            placeholder="e.g., https://yourportfolio.com"
          />
        </div>
  
        <!-- Profile Picture -->
        <div class="mb-4">
          <label for="profilePic" class="block text-sm font-medium text-gray-700">Profile Picture</label>
          <input
            type="file"
            id="profilePic"
            name="profilePic"
            accept="image/*"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-200 focus:outline-none"
          />
        </div>
  
        <!-- Additional Image 1 -->
        <div class="mb-4">
          <label for="image1" class="block text-sm font-medium text-gray-700">Additional Image 1</label>
          <input
            type="file"
            id="image1"
            name="image1"
            accept="image/*"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-200 focus:outline-none"
          />
        </div>
  
        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:ring focus:ring-blue-200 focus:outline-none"
        >
          Update Profile
        </button>
  
        <!-- Success and Error Messages -->
        <div id="successMessage" class="hidden mt-4 text-green-500">Profile updated successfully!</div>
        <div id="errorMessage" class="hidden mt-4 text-red-500">Error updating profile.</div>
      </form>
    </div>
  </div>
  
  <footer class="mt-8 bg-blue-950 text-gray-100 py-6">
    <div class="container mx-auto px-4 text-center">
      <hr class="my-4 border-blueGray-300">
      <p class="text-sm font-semibold">© 2024 SwiftWork. All rights reserved.</p>
    </div>
  </footer>
  <script src="freelancer-update.js"></script>
</body>
</html>
