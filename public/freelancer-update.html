<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Freelancer Profile</title>
  <link href="src/output.css" rel="stylesheet">
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-[#2B2A4C] text-[#EEE2DE]"">

  <header class="bg-[#EEE2DE] placeholder: shadow-md">
    <nav class="flex items-center justify-between w-[92%] mx-auto py-4">
      <!-- Logo -->
      <div class="text-center">
        <h1 class="text-3xl font-bold text-[#e56f08]">SwiftWork</h1>
      </div>

      <!-- Navigation Links -->
      <ul class="hidden md:flex space-x-8 text-lg">
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#home">Home</a></li>
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#about-us">About</a></li>
        <li><a class="hover:text-[#000000] text-[#e56f08] transition-colors" href="index.html#contact-us">Contact us</a></li>
      </ul>

      <!-- Mobile Menu Toggle -->
      <button id="menu-toggle" class="block md:hidden text-[#e56f08] focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
    </nav>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-[#EEE2DE] text-center text-lg py-4">
      <a href="index.html#home" class="block py-2 text-[#e56f08] hover:text-[#000000]">Home</a>
      <a href="index.html#about-us" class="block py-2 text-[#e56f08] hover:text-[#000000]">About</a>
      <a href="index.html#contact-us" class="block py-2 text-[#e56f08] hover:text-[#000000]">Contact us</a>
    </div>
  </header>
  <div class="flex items-center justify-center min-h-screen py-12 px-4">
    <!-- Update Freelancer Profile Form Container -->
    <div class="w-full max-w-md bg-[#EEE2DE] text-[#2B2A4C] rounded-lg shadow-lg p-8 flex flex-col">
      <h2 class="text-3xl font-extrabold text-center mb-4">Update Freelancer Profile</h2>
      <p class="text-center mb-6 text-[#EA906C]">Keep your profile up-to-date to attract the best clients!</p>
  
      <form id="updateFreelancerForm" enctype="multipart/form-data" class="flex-grow">
        <!-- Name -->
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium">Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            required 
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm bg-white text-[#2B2A4C] focus:ring-[#EA906C] focus:border-[#EA906C]" 
            placeholder="Enter your name" 
          />
        </div>
  
        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm bg-white text-[#2B2A4C] focus:ring-[#EA906C] focus:border-[#EA906C]" 
            placeholder="Enter your email" 
          />
        </div>
  
        <!-- Skills -->
        <div class="mb-4">
          <label for="skills" class="block text-sm font-medium">Skills</label>
          <input 
            type="text" 
            id="skills" 
            name="skills" 
            required 
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm bg-white text-[#2B2A4C] focus:ring-[#EA906C] focus:border-[#EA906C]" 
            placeholder="Enter your skills" 
          />
        </div>
  
        <!-- Bio -->
        <div class="mb-4">
          <label for="bio" class="block text-sm font-medium">Bio</label>
          <textarea 
            id="bio" 
            name="bio" 
            rows="4" 
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm bg-white text-[#2B2A4C] focus:ring-[#EA906C] focus:border-[#EA906C]" 
            placeholder="Write a brief bio about yourself"
          ></textarea>
        </div>
  
        <!-- Portfolio URL -->
        <div class="mb-4">
          <label for="portfolio" class="block text-sm font-medium">Portfolio URL</label>
          <input 
            type="url" 
            id="portfolio" 
            name="portfolio" 
            class="mt-2 block w-full px-4 py-2 border border-[#EA906C] rounded-lg shadow-sm bg-white text-[#2B2A4C] focus:ring-[#EA906C] focus:border-[#EA906C]" 
            placeholder="e.g., https://yourportfolio.com" 
          />
        </div>
  
        <!-- Profile Picture -->
        <div class="mb-4">
          <label for="profilePic" class="block text-sm font-medium">Profile Picture</label>
          <input 
            type="file" 
            id="profilePic" 
            name="profilePic" 
            accept="image/*" 
            class="w-full px-4 py-2 border border-[#EA906C] rounded-lg focus:ring focus:ring-[#EA906C] focus:outline-none" 
          />
        </div>
  
        <!-- Additional Image 1 -->
        <div class="mb-4">
          <label for="image1" class="block text-sm font-medium">Additional Image 1</label>
          <input 
            type="file" 
            id="image1" 
            name="image1" 
            accept="image/*" 
            class="w-full px-4 py-2 border border-[#EA906C] rounded-lg focus:ring focus:ring-[#EA906C] focus:outline-none" 
          />
        </div>
  
        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn" 
          class="w-full px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:ring focus:ring-blue-200 focus:outline-none"
        >
          Update Profile
        </button>
  
        <!-- Success and Error Messages -->
        <div id="successMessage" class="hidden mt-4 text-green-500">Profile updated successfully!</div>
        <div id="errorMessage" class="hidden mt-4 text-red-500">Error updating profile.</div>
      </form>
    </div>
  </div>
  
  
  <footer class="bg-[#2B2A4C] py-6">
    <div class="container mx-auto px-4 text-center">
      <hr class="my-4 border-[#EEE2DE]">
      <p class="text-sm">
        © 2024 SwiftWork. <a href="#home" class="text-[#EA906C] hover:underline">All rights reserved.</a>
      </p>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    const menuToggle = document.getElementById("menu-toggle");
    const mobileMenu = document.getElementById("mobile-menu");

    menuToggle.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
  </script>
  <script src="freelancer-update.js"></script>
</body>
</html>
