<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Gig</title>

    <!-- Link to external CSS file -->
    <!-- <link rel="stylesheet" href="gig-create.css"> -->
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="flex flex-col min-h-screen" style="background-image: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);">

    <header class="bg-gray-100 font-[Montserrat-bold] shadow-md">
        <nav class="flex  items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center">
          <!-- Logo -->
          <div class="md:text-left text-center">
            <h1 class="text-3xl text-blue-500 font-bold">Swiftwork</h1>
          </div>
      
          <!-- Navigation Links -->
          <div
            class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
          >
            <ul
              class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
            >
              <li>
                <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
              </li>
              <li>
                <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
              </li>
              <li>
                <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
              </li>
            </ul>
          </div>
        </nav>
      </header>
    <!-- Create Gig Form -->
    <div class="form-container max-w-lg w-full mt-4 mx-auto p-6 bg-white rounded-lg shadow-lg space-y-6 flex-grow">
        <h2 class="text-2xl font-bold text-gray-800 text-center">Create a New Gig</h2>
        <form id="create-gig-form" class="space-y-4">
            <!-- Gig Title -->
            <div class="form-group">
                <label for="title" class="block text-sm font-medium text-gray-700">Gig Title</label>
                <input type="text" id="title" name="title" 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                    placeholder="Enter your gig title" required />
            </div>
    
            <!-- Description -->
            <div class="form-group">
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" name="description" rows="4" 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                    placeholder="Write a detailed description" required></textarea>
            </div>
    
            <!-- Budget -->
            <div class="form-group">
                <label for="budget" class="block text-sm font-medium text-gray-700">Budget</label>
                <input type="number" id="budget" name="budget" 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                    placeholder="Enter your budget" required />
            </div>
    
            <!-- Deadline -->
            <div class="form-group">
                <label for="deadline" class="block text-sm font-medium text-gray-700">Deadline</label>
                <input type="date" id="deadline" name="deadline" 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                    required />
            </div>
            <!-- Skills Required -->
<div class="form-group">
  <label for="skillsRequired" class="block text-sm font-medium text-gray-700">Skills Required</label>
  <input type="text" id="skillsRequired" name="skillsRequired" 
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
      placeholder="Enter required skills (comma-separated)" required />
</div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit"
                 class="bg-green-500 w-full text-white py-2 px-6 rounded-full shadow-md hover:bg-green-600 transition duration-300" >
                    Create Gig
                  </button>
                <!-- <button type="submit" 
                    class="w-full px-4 py-2 bg-blue-500 text-white font-semibold rounded-md shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Create Gig
                </button> -->
            </div>
        </form>
    </div>
    
    <footer class=" mt-4 relative bg-blueGray-200 pt-8 pb-6 bg-blue-950">
        <div class="container mx-auto px-4">
          <hr class="my-6 border-blueGray-300">
                <div class="flex flex-wrap items-center md:justify-between justify-center">
                  <div class="w-full md:w-4/12 px-4 mx-auto text-center">
                    <div class="text-sm text-blueGray-500 font-semibold py-1 text-gray-100">
                      © 2024 <span id="get-current-year">SwiftWork.</span><a href="#home" class="text-blueGray-500 hover:text-gray-800" target="_blank"> All rights reserved.
                      
                    </a>
                  </div>
                </div>
              </div>
      </footer>
    <!-- Link to external JavaScript file -->
    <script src="gig-create.js"></script>
</body>
</html>
