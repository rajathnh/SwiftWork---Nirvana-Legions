<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Gig</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="gig-create.css">
</head>
<body>

    <!-- Create Gig Form -->
    <div class="form-container">
        <h2>Create a New Gig</h2>
        <form id="create-gig-form">
            <div class="form-group">
                <label for="title">Gig Title</label>
                <input type="text" id="title" name="title" required />
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="budget">Budget</label>
                <input type="number" id="budget" name="budget" required />
            </div>
            <div class="form-group">
                <label for="deadline">Deadline</label>
                <input type="date" id="deadline" name="deadline" required />
            </div>
            <button type="submit" class="submit-btn">Create Gig</button>
        </form>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="gig-create.js"></script>
</body>
</html>
