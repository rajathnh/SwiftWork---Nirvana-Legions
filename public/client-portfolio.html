<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portfolio</title>
  <!-- <link rel="stylesheet" href="client-portfolio.css"> -->
  <link rel="stylesheet" href="src/output.css">
</head>

<body  class="portfolio-body m-0 "></body>
<header class="bg-gray-100 font-[Montserrat-bold] shadow-md m-0">
  <nav class="flex  items-center w-[92%] text-xl mx-auto py-4 md:justify-between justify-center m-0">
    <!-- Logo -->
    <div class="md:text-left text-center">
      <h1 class="text-3xl text-blue-500 font-bold">SwiftWork</h1>
    </div>

    <div class="flex items-center justify-center mx-auto"><span class="text-2xl">Client Portfolio</span>
    </div>

    <!-- Navigation Links -->
    <div
      class="nav-links md:static absolute bg-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-100%] w-auto items-center px-5 hidden md:block"
    >
      <ul
        class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8"
      >
        <li>
          <a class="hover:text-blue-500 transition-colors" href="index.html#home">Home</a>
        </li>
        <li>
          <a class="hover:text-blue-500 transition-colors" href="index.html#about-us">About</a>
        </li>
        <li>
          <a class="hover:text-blue-500 transition-colors" href="index.html#contact-us">Contact us</a>
        </li>
      </ul>
    </div>
  </nav>
</header>

  
  <div class="portfolio-container flex flex-row space-x-10 mx-auto mt-14 justify-center items-center">
    <div class="client-profile  p-4 rounded-lg shadow-2xl flex flex-col items-center justify-center space-y-2 w-2/5 mb-10 min-h-10">
         <img id="profile-pic" class="w-40 h-40 rounded-full" src="uploads/default.jpg" alt="Profile Picture">  
         <p id="client-name">Loading client name...</p>
         <p id="client-email">Loading client email...</p>
    </div>

    <div class="client-profile  p-6 rounded-lg shadow-2xl w-2/5 min-h-48">
       <span class="text-xl">Reviews from the Clients</span>
    </div>
  </div>


  <div class ="flex items-center justify-center">
      <h1 class="text-3xl font-bold mb-6 mt-6">
        Gigs
       </h1>
  </div>
  <ul id="gigs-list" class="gigs-list"></ul>

  <div class ="flex items-center justify-center">
      <h1 class="text-3xl font-bold mb-2 mt-6">
        Previous Job Listings
      </h1>
    </div>
  <div id="gigs-container" class="grid grid-cols-1 min-w-full md:grid-cols-2  gap-10 place-items-center   mx-8 py-12 "> 
    <!--completed gigs will appear here -->
  </div>


<div  class = "flex items-center justify-center">
<button id="create-gig-button" 
onclick="window.location.href='gig-create.html'" 
style="display: none; margin-top: 3rem; margin-bottom: 3rem; padding: 1rem 1.5rem; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 1.5rem; cursor: pointer;">
Post a job
</button>
</div>

<footer class="relative bg-blueGray-200 pt-8 pb-6 bg-blue-950">
  <div class="container mx-auto px-4">
    <hr class="my-6 border-blueGray-300">
          <div class="flex flex-wrap items-center md:justify-between justify-center">
            <div class="w-full md:w-4/12 px-4 mx-auto text-center">
              <div class="text-sm text-blueGray-500 font-semibold py-1 text-gray-100">
                © 2024 <span id="get-current-year">SwiftWork.</span><a href="#home" class="text-blueGray-500 hover:text-gray-800" target="_blank"> All rights reserved.
                
              </div>
            </div>
          </div>
        </div>
</footer>

  <script src="client-portfolio.js"></script>
</body>

</html>
