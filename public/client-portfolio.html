<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftWork - Client Portfolio</title>
    <link rel="stylesheet" href="src/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen font-montserrat text-gray-800">
    <!-- Navbar -->
    <header class="bg-gray-100 shadow-md">
        <nav class="flex items-center w-[92%] mx-auto py-4 justify-between">
            <div>
                <h1 class="text-3xl text-blue-500 font-bold">SwiftWork</h1>
            </div>
            <div class="flex items-center">
                <span class="text-xl">Client Portfolio</span>
            </div>
            <div>
                <a href="#" class="hover:text-blue-500 transition-colors">Dashboard</a>
                <a href="#" class="hover:text-blue-500 transition-colors">Gigs</a>
                <a href="#" class="hover:text-blue-500 transition-colors">Messages</a>
            </div>
        </nav>
    </header>

    <!-- Profile Section -->
    <div class="flex flex-row space-x-10 mx-auto mt-14 justify-center items-center">
        <div class="client-profile p-4 rounded-lg shadow-2xl flex flex-col items-center justify-center space-y-2 w-2/5">
            <img id="profile-pic" src="uploads/default.jpg" alt="Profile Picture" class="w-32 h-32 rounded-full">
            <p id="client-name" class="text-lg font-semibold">John Doe</p>
            <p id="client-email" class="text-gray-600">john.doe@example.com</p>
        </div>
        <div class="client-profile p-6 rounded-lg shadow-2xl w-2/5">
            <h3 class="text-xl">Reviews from the Clients</h3>
            <!-- Add dynamically populated reviews here -->
        </div>
    </div>

    <!-- Gigs Section -->
    <div class="flex items-center justify-center">
        <h1 class="text-3xl font-bold my-6">Gigs</h1>
    </div>
    <ul id="gigs-list" class="gigs-list"></ul>
    <div id="gigs-container" class="grid grid-cols-1 md:grid-cols-2 gap-10 place-items-center mx-8 py-12">
        <!-- Completed gigs will appear here -->
    </div>

    <div class="flex items-center justify-center">
        <button id="create-gig-button" onclick="window.location.href='gig-create.html'" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600">
            Post a Job
        </button>
    </div>

    <!-- Footer -->
    <footer class="bg-blue-950 text-gray-100 py-6">
        <div class="container mx-auto text-center">
            <p>&copy; 2024 SwiftWork. All rights reserved.</p>
        </div>
    </footer>

    <script src="client-portfolio.js"></script>
</body>
</html>
